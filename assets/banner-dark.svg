<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(730 40) rotate(135) scale(260 180)">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(620 170) rotate(135) scale(220 140)">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0caf5"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#292e42" stroke-width="0.7" opacity="0.5"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="189" rx="14" fill="url(#bg)" stroke="#292e42"/>
  <rect x="1" y="1" width="858" height="188" rx="13" fill="url(#grid)"/>
  <rect x="1" y="1" width="858" height="188" rx="13" fill="url(#glow1)"/>
  <rect x="1" y="1" width="858" height="188" rx="13" fill="url(#glow2)"/>

  <!-- Pill badge -->
  <rect x="36" y="28" width="224" height="24" rx="12" fill="#24283b" stroke="#414868"/>
  <circle cx="51" cy="40" r="3.5" fill="#9ece6a"/>
  <text x="63" y="44" fill="#a9b1d6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.6">
    FRONTEND · DESKTOP · AI
  </text>

  <!-- Title -->
  <text x="36" y="96" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">
    Hi, I'm Tema
  </text>

  <!-- Subtitle -->
  <text x="36" y="126" fill="#9aa5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5">
    Crafting clean web UIs, browser extensions &amp; native Linux plugins for Omarchy
  </text>

  <!-- Tech chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    <circle cx="42" cy="156" r="4" fill="#7aa2f7"/>
    <text x="52" y="160" fill="#c0caf5">TypeScript</text>

    <circle cx="144" cy="156" r="4" fill="#7dcfff"/>
    <text x="154" y="160" fill="#c0caf5">React / Next.js</text>

    <circle cx="280" cy="156" r="4" fill="#ff9e64"/>
    <text x="290" y="160" fill="#c0caf5">Rust</text>

    <circle cx="342" cy="156" r="4" fill="#9ece6a"/>
    <text x="352" y="160" fill="#c0caf5">Qt / QML</text>

    <circle cx="432" cy="156" r="4" fill="#bb9af7"/>
    <text x="442" y="160" fill="#c0caf5">Hyprland / Omarchy</text>
  </g>
</svg>
